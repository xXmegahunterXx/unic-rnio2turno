<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090f" />
    <title>Sintonia · Apuração ao vivo e Teste Cego do 2º turno</title>
    <meta name="description" content="Apuração do 2º turno de 2026 ao vivo, estado por estado, cidade por cidade, seção por seção. E o Teste Cego: concorde ou discorde de ideias sem saber de quem são." />
    <!--app-meta-->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sintonia" />
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        try {
          t = localStorage.getItem('sintonia:tema');
        } catch (e) {}
        // Widgets incorporados (/embed/…): o tema da URL (?tema=claro|escuro) vale mais que a preferência salva;
        // sem ele, segue o sistema de quem lê o site que incorporou.
        var href = location.href;
        if (href.indexOf('/embed/') >= 0) {
          var m = /\/embed\/[^?#]*\?(?:[^#]*&)?tema=(claro|light|escuro|dark)/.exec(href);
          if (m) t = m[1] === 'claro' || m[1] === 'light' ? 'light' : 'dark';
          else {
            try {
              t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            } catch (e) {}
          }
        }
        // Modo streamer (/live, fonte de navegador do OBS): tema e fundo pela URL antes da 1ª pintura — sem isso, a fonte
        // "piscaria" com o fundo do site ao ativar a cena. Nunca usa a preferência salva. Padrões = components/live/opcoes.ts.
        var rota = location.hash.charAt(1) === '/' ? location.hash.slice(1) : location.pathname + location.search;
        if (/^\/live\/?(\?|$)/.test(rota)) {
          var q = rota.split('?')[1] || '';
          var ler = function (k) {
            var r = new RegExp('(?:^|&)' + k + '=([a-z]+)').exec(q.toLowerCase());
            return r ? r[1] : '';
          };
          var f = { dark: 'escuro', light: 'claro', transparent: 'transparente', nenhum: 'transparente' }[ler('fundo')] || ler('fundo');
          if (f !== 'escuro' && f !== 'claro' && f !== 'transparente') f = /^(barra|canto)$/.test(ler('layout')) ? 'transparente' : 'escuro';
          var tm = ler('tema');
          t = f === 'claro' ? 'light' : f === 'escuro' ? 'dark' : tm === 'claro' || tm === 'light' ? 'light' : 'dark';
          if (f === 'transparente') {
            d.setAttribute('data-fundo', 'transparente');
            var st = document.createElement('style');
            st.textContent = 'html[data-fundo=transparente],html[data-fundo=transparente] body{background:transparent!important}';
            document.head.appendChild(st);
          }
        }
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        // Barra do navegador (Safari, Chrome e navegadores embutidos como o do X) na cor do fundo do tema.
        if (d.getAttribute('data-theme') === 'light') {
          var c = document.querySelector('meta[name="theme-color"]');
          if (c) c.setAttribute('content', '#f6f6fb');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
