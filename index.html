<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090f" />
    <title>Sintonia · Apuração ao vivo e Teste Cego do 2º turno</title>
    <meta name="description" content="Apuração do 2º turno de 2026 ao vivo, estado por estado, cidade por cidade, seção por seção. E o Teste Cego: escolha propostas sem saber de quem são." />
    <!--app-meta-->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sintonia" />
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        try {
          t = localStorage.getItem('sintonia:tema');
        } catch (e) {}
        // Widgets incorporados (/embed/…): o tema da URL (?tema=claro|escuro) vale mais que a preferência salva;
        // sem ele, segue o sistema de quem lê o site que incorporou.
        var href = location.href;
        if (href.indexOf('/embed/') >= 0) {
          var m = /\/embed\/[^?#]*\?(?:[^#]*&)?tema=(claro|light|escuro|dark)/.exec(href);
          if (m) t = m[1] === 'claro' || m[1] === 'light' ? 'light' : 'dark';
          else {
            try {
              t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            } catch (e) {}
          }
        }
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        // Barra do navegador (Safari, Chrome e navegadores embutidos como o do X) na cor do fundo do tema.
        if (d.getAttribute('data-theme') === 'light') {
          var c = document.querySelector('meta[name="theme-color"]');
          if (c) c.setAttribute('content', '#f6f6fb');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
