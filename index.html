<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090f" />
    <title>Sintonia · Apuração ao vivo e Teste Cego do 2º turno</title>
    <meta name="description" content="Apuração do 2º turno de 2026 ao vivo, estado por estado, cidade por cidade, seção por seção. E o Teste Cego: escolha propostas sem saber de quem são." />
    <!--app-meta-->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('sintonia:tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
